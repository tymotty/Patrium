<!----------------------------------Lancamento------------------------------------->
<!--------------------------------------------------------------------------------->
<div class="modal-overlay" id="modal-lancamento" role="dialog" aria-modal="true" aria-labelledby="lanc-titulo">
    <div class="modal-conteudo" id="lanc-modal">

        <header class="modal-header">
            <div>
                <h2 class="titule lancamento" id="lanc-titulo">Novo lançamento</h2>
                <p class="subtitule lancamento" id="lanc-subtitulo">O que você deseja registrar?</p>
            </div>
            <button type="button" class="btn-fechar-modal" id="lanc-fechar" aria-label="Fechar">✕</button>
        </header>

        <!-- indicador de etapas (gerado pelo JS) -->
        <ol class="stepper" id="lanc-stepper" aria-label="Etapas do lançamento"></ol>

        <!-- conteúdo da etapa atual (gerado pelo JS) -->
        <div class="lanc-corpo" id="lanc-corpo"></div>

        <p class="dica-toque" id="lanc-dica">Toque em uma opção para continuar</p>

        <!-- Voltar / Salvar lançamento (gerado pelo JS) -->
        <footer class="modal-rodape" id="lanc-rodape"></footer>
    </div>
</div>

<!---Script--->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
