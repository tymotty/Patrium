<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/lancamento.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrium</title>
</head>
<body>
    
<!--------------------------------------------------------------------------------->
<!------------------------------------NAV------------------------------------------>
<!--------------------------------------------------------------------------------->
    <aside class="sidebar">
        <div class="brand">
            <a href="index.html" class="brand" aria-label="Ir para a visão geral">
                <h1 id="title">Patrium</h1>
            </a>
            <p id="subtitle">Gerenciamento de Patrimônio</p>
        </div>

        <!-----MENU----->
        <nav aria-label="Menu de navegação">
            <ul>
                <li><a href="index.html" class="nav-item" id="nav-visao-geral">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Visão Geral</span>
                </a></li>

                <li><a href="investimentos.html" class="nav-item" id="nav-investimentos">
                    <i data-lucide="trending-up"></i>
                    <span>Investimentos</span>
                </a></li>

                <li><button data-abrir-lancamento class="nav-item" data-section="lancamentos"
                     id="nav-lancamentos">
                    <i data-lucide="plus-circle"></i>
                    <span>Lançamentos</span>
                </button></li>
                
                <li><a href="orcamento.html" class="nav-item" id="nav-orcamento">
                    <i data-lucide="dollar-sign"></i>
                    <span>Orçamento</span>
                </a></li>

                <li class="nav-hide-mobile"><a href="metas.html" class="nav-item" id="nav-metas">
                    <i data-lucide="target"></i>
                    <span>Metas</span>
                </a></li>

                <li class="nav-hide-mobile"><a href="#historico" class="nav-item" id="nav-historico">
                    <i data-lucide="clock"></i>
                    <span>Histórico</span>
                </a></li>

                <li class="nav-hide-mobile"><a href="#personalizar" class="nav-item" id="nav-personalizar">
                    <i data-lucide="edit"></i>
                    <span>Personalizar</span>
                </a></li>

                <li class="nav-hide-mobile"><a href="configuracoes.html" class="nav-item" id="nav-configuracoes">
                    <i data-lucide="settings"></i>
                    <span>Configurações</span>
                </a></li>

                <li><a href="conta.html" class="nav-item" id="nav-conta">
                    <i data-lucide="user"></i>
                    <span>Conta</span>
                </a></li>
            </ul>
        </nav>
    </aside>



<!--------------------------------------------------------------------------------->
<!----------------------------------DASHBOARD-------------------------------------->
<!--------------------------------------------------------------------------------->
    <main class="dashboard" id="visao-geral" >

        <header class="dashboard-header"> <!--Header Com filtro-->
            <section class="dashboard-header-left"> <!--Info header-->
                <h1 class="dashboard-title" id="visao-geral-title-usuario">Bem-vindo, [NOME_DO_USUARIO]!</h1>
                <p class="dashboard-subtitle" id="visao-geral-subtitle">[DATA] · Atualizado agora</p>
            </section>
            <section class="dashboard-header-right"> <!--Filter time-->
                <div class="filter-header">
                    <button class="btn-filter" id="btn-filter-1m" aria-label="Filtrar 1 M">
                        1M
                    </button>
                    <button class="btn-filter" id="btn-filter-3m" aria-label="Filtrar 3 M">
                        3M
                    </button>
                    <button class="btn-filter" id="btn-filter-12m" aria-label="Filtrar 12 M">
                        12M
                    </button>
                    <button class="btn-filter" id="btn-filter-tudo" aria-label="Filtrar Tudo">
                        Tudo
                    </button>
                </div>
                <button class="hide-button" aria-label="Ocultar">
                    <i data-lucide="eye"></i>
                </button>
                <button class="btn-lancamento" data-abrir-lancamento aria-label="Novo lançamento">
                    <i data-lucide="plus"></i>
                </button>
            </section>
        </header>

        <section>
            <article class="widget-patrimonio-total"></article>

            <section class="widget-cards">
                <div class="card-lucro-acumulado"></div>
                <div class="card-receita"></div>
                <div class="card-guardado"></div>
            </section>

            <article class="widget-alocacao"></article>

            <article class="widget-orcamento"></article>

            <article class="widget-metas"></article>

            <article class="widget-carteira"></article>

            <article class="widget-lancamentos"></article>
        </section>
    </main>
<!--------------------------------------------------------------------------------->
<!----------------------------------Lancamento------------------------------------->
<!--------------------------------------------------------------------------------->
<div class="modal-overlay" id="modal-lancamento" role="dialog" aria-modal="true" aria-labelledby="lanc-titulo">
    <div class="modal-conteudo" id="lanc-modal">

        <header class="modal-header">
            <div>
                <h2 class="titule lancamento" id="lanc-titulo">Novo lançamento</h2>
                <p class="subtitule lancamento" id="lanc-subtitulo">O que você deseja registrar?</p>
            </div>
            <button type="button" class="btn-fechar-modal" id="lanc-fechar" aria-label="Fechar">✕</button>
        </header>

        <!-- indicador de etapas (gerado pelo JS) -->
        <ol class="stepper" id="lanc-stepper" aria-label="Etapas do lançamento"></ol>

        <!-- conteúdo da etapa atual (gerado pelo JS) -->
        <div class="lanc-corpo" id="lanc-corpo"></div>

        <p class="dica-toque" id="lanc-dica">Toque em uma opção para continuar</p>

        <!-- Voltar / Salvar lançamento (gerado pelo JS) -->
        <footer class="modal-rodape" id="lanc-rodape"></footer>
    </div>
</div>

<!---Script--->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="js/lancamento.js"></script>
    <script>lucide.createIcons();</script>
    <script src="js/javaScript.js"></script>
</body>
</html>
